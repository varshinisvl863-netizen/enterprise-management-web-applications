<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Delivery Platform</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
    color:#3498db;
}

.section{
    background:#fff;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input, select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.add-btn{
    background:#28a745;
}

.edit-btn{
    background:#007bff;
}

.delete-btn{
    background:#dc3545;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th,
table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

table th{
    background:#34495e;
    color:white;
}

.status-pending{
    color:#ff9800;
    font-weight:bold;
}

.status-delivered{
    color:#28a745;
    font-weight:bold;
}

@media(max-width:768px){
    table{
        display:block;
        overflow-x:auto;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>Food Delivery Platform</h1>

    <div class="dashboard">
        <div class="card">
            <h2 id="totalOrders">0</h2>
            <p>Total Orders</p>
        </div>

        <div class="card">
            <h2 id="pendingOrders">0</h2>
            <p>Pending Orders</p>
        </div>

        <div class="card">
            <h2 id="deliveredOrders">0</h2>
            <p>Delivered Orders</p>
        </div>
    </div>

    <div class="section">
        <h2>Create Order</h2>

        <input type="text" id="customerName" placeholder="Customer Name">

        <input type="text" id="foodItem" placeholder="Food Item">

        <input type="text" id="address" placeholder="Delivery Address">

        <select id="status">
            <option value="">Select Status</option>
            <option>Pending</option>
            <option>Preparing</option>
            <option>Out for Delivery</option>
            <option>Delivered</option>
        </select>

        <button class="add-btn" onclick="saveOrder()">
            Save Order
        </button>
    </div>

    <div class="section">
        <h2>Order Records</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Food Item</th>
                    <th>Address</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="orderTable"></tbody>
        </table>
    </div>

</div>

<script>

let orders = [];
let editIndex = -1;

function saveOrder(){

    const customerName =
        document.getElementById("customerName").value;

    const foodItem =
        document.getElementById("foodItem").value;

    const address =
        document.getElementById("address").value;

    const status =
        document.getElementById("status").value;

    if(customerName==="" || foodItem==="" ||
       address==="" || status===""){
        alert("Please fill all fields");
        return;
    }

    if(editIndex === -1){

        orders.push({
            id: orders.length + 1,
            customerName,
            foodItem,
            address,
            status
        });

    }else{

        orders[editIndex].customerName = customerName;
        orders[editIndex].foodItem = foodItem;
        orders[editIndex].address = address;
        orders[editIndex].status = status;

        editIndex = -1;
    }

    clearForm();
    displayOrders();
}

function displayOrders(){

    let table = document.getElementById("orderTable");
    table.innerHTML = "";

    let pending = 0;
    let delivered = 0;

    orders.forEach((order,index)=>{

        if(order.status === "Pending"){
            pending++;
        }

        if(order.status === "Delivered"){
            delivered++;
        }

        let statusClass =
            order.status === "Delivered"
            ? "status-delivered"
            : "status-pending";

        table.innerHTML += `
        <tr>
            <td>${order.id}</td>
            <td>${order.customerName}</td>
            <td>${order.foodItem}</td>
            <td>${order.address}</td>
            <td class="${statusClass}">
                ${order.status}
            </td>
            <td>
                <button class="edit-btn"
                onclick="editOrder(${index})">
                Edit
                </button>

                <button class="delete-btn"
                onclick="deleteOrder(${index})">
                Delete
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("totalOrders").innerText =
        orders.length;

    document.getElementById("pendingOrders").innerText =
        pending;

    document.getElementById("deliveredOrders").innerText =
        delivered;
}

function editOrder(index){

    document.getElementById("customerName").value =
        orders[index].customerName;

    document.getElementById("foodItem").value =
        orders[index].foodItem;

    document.getElementById("address").value =
        orders[index].address;

    document.getElementById("status").value =
        orders[index].status;

    editIndex = index;
}

function deleteOrder(index){

    if(confirm("Delete this order?")){

        orders.splice(index,1);

        orders.forEach((order,i)=>{
            order.id = i + 1;
        });

        displayOrders();
    }
}

function clearForm(){

    document.getElementById("customerName").value = "";
    document.getElementById("foodItem").value = "";
    document.getElementById("address").value = "";
    document.getElementById("status").value = "";
}

displayOrders();

</script>

</body>
</html>
