<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
    color:#3498db;
    margin-bottom:10px;
}

.section{
    background:#fff;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input, select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.add-btn{
    background:#28a745;
}

.edit-btn{
    background:#007bff;
}

.delete-btn{
    background:#dc3545;
}

.present{
    color:green;
    font-weight:bold;
}

.absent{
    color:red;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th,
table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

table th{
    background:#34495e;
    color:white;
}

@media(max-width:768px){
    table{
        display:block;
        overflow-x:auto;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>Attendance Management System</h1>

    <div class="dashboard">
        <div class="card">
            <h2 id="totalStudents">0</h2>
            <p>Total Students</p>
        </div>

        <div class="card">
            <h2 id="presentCount">0</h2>
            <p>Present</p>
        </div>

        <div class="card">
            <h2 id="absentCount">0</h2>
            <p>Absent</p>
        </div>
    </div>

    <div class="section">
        <h2>Add Attendance Record</h2>

        <input type="text" id="studentName" placeholder="Student Name">

        <input type="text" id="rollNo" placeholder="Roll Number">

        <select id="status">
            <option value="">Select Attendance Status</option>
            <option>Present</option>
            <option>Absent</option>
        </select>

        <button class="add-btn" onclick="saveAttendance()">
            Save Record
        </button>
    </div>

    <div class="section">
        <h2>Attendance Records</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student Name</th>
                    <th>Roll No</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="attendanceTable"></tbody>
        </table>
    </div>

</div>

<script>

let records = [];
let editIndex = -1;

function saveAttendance(){

    let studentName =
        document.getElementById("studentName").value;

    let rollNo =
        document.getElementById("rollNo").value;

    let status =
        document.getElementById("status").value;

    if(studentName === "" || rollNo === "" || status === ""){
        alert("Please fill all fields");
        return;
    }

    if(editIndex === -1){

        records.push({
            id: records.length + 1,
            studentName,
            rollNo,
            status
        });

    }else{

        records[editIndex].studentName = studentName;
        records[editIndex].rollNo = rollNo;
        records[editIndex].status = status;

        editIndex = -1;
    }

    clearForm();
    displayRecords();
}

function displayRecords(){

    let table =
        document.getElementById("attendanceTable");

    table.innerHTML = "";

    let present = 0;
    let absent = 0;

    records.forEach((record,index)=>{

        if(record.status === "Present"){
            present++;
        }else{
            absent++;
        }

        let statusClass =
            record.status === "Present"
            ? "present"
            : "absent";

        table.innerHTML += `
        <tr>
            <td>${record.id}</td>
            <td>${record.studentName}</td>
            <td>${record.rollNo}</td>
            <td class="${statusClass}">
                ${record.status}
            </td>
            <td>
                <button class="edit-btn"
                onclick="editRecord(${index})">
                Edit
                </button>

                <button class="delete-btn"
                onclick="deleteRecord(${index})">
                Delete
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("totalStudents").innerText =
        records.length;

    document.getElementById("presentCount").innerText =
        present;

    document.getElementById("absentCount").innerText =
        absent;
}

function editRecord(index){

    document.getElementById("studentName").value =
        records[index].studentName;

    document.getElementById("rollNo").value =
        records[index].rollNo;

    document.getElementById("status").value =
        records[index].status;

    editIndex = index;
}

function deleteRecord(index){

    if(confirm("Delete this attendance record?")){

        records.splice(index,1);

        records.forEach((record,i)=>{
            record.id = i + 1;
        });

        displayRecords();
    }
}

function clearForm(){

    document.getElementById("studentName").value = "";
    document.getElementById("rollNo").value = "";
    document.getElementById("status").value = "";
}

displayRecords();

</script>

</body>
</html>
