<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Booking Application</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
    color:#3498db;
}

.section{
    background:#fff;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input, select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.add-btn{
    background:#28a745;
}

.edit-btn{
    background:#007bff;
}

.delete-btn{
    background:#dc3545;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th,
table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

table th{
    background:#34495e;
    color:white;
}

@media(max-width:768px){
    table{
        display:block;
        overflow-x:auto;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>Hotel Booking Application</h1>

    <div class="dashboard">
        <div class="card">
            <h2 id="bookingCount">0</h2>
            <p>Total Bookings</p>
        </div>

        <div class="card">
            <h2 id="checkedIn">0</h2>
            <p>Checked In</p>
        </div>

        <div class="card">
            <h2 id="checkedOut">0</h2>
            <p>Checked Out</p>
        </div>
    </div>

    <div class="section">
        <h2>New Booking</h2>

        <input type="text" id="guestName" placeholder="Guest Name">

        <input type="text" id="roomNo" placeholder="Room Number">

        <input type="date" id="checkInDate">

        <select id="status">
            <option value="">Select Status</option>
            <option>Booked</option>
            <option>Checked In</option>
            <option>Checked Out</option>
        </select>

        <button class="add-btn" onclick="saveBooking()">
            Save Booking
        </button>
    </div>

    <div class="section">
        <h2>Booking Records</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Guest Name</th>
                    <th>Room No</th>
                    <th>Check-In Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="bookingTable"></tbody>
        </table>
    </div>

</div>

<script>

let bookings = [];
let editIndex = -1;

function saveBooking(){

    let guestName =
        document.getElementById("guestName").value;

    let roomNo =
        document.getElementById("roomNo").value;

    let checkInDate =
        document.getElementById("checkInDate").value;

    let status =
        document.getElementById("status").value;

    if(guestName==="" || roomNo==="" ||
       checkInDate==="" || status===""){
        alert("Please fill all fields");
        return;
    }

    if(editIndex === -1){

        bookings.push({
            id: bookings.length + 1,
            guestName,
            roomNo,
            checkInDate,
            status
        });

    }else{

        bookings[editIndex].guestName = guestName;
        bookings[editIndex].roomNo = roomNo;
        bookings[editIndex].checkInDate = checkInDate;
        bookings[editIndex].status = status;

        editIndex = -1;
    }

    clearForm();
    displayBookings();
}

function displayBookings(){

    let table =
        document.getElementById("bookingTable");

    table.innerHTML = "";

    let checkedIn = 0;
    let checkedOut = 0;

    bookings.forEach((booking,index)=>{

        if(booking.status === "Checked In"){
            checkedIn++;
        }

        if(booking.status === "Checked Out"){
            checkedOut++;
        }

        table.innerHTML += `
        <tr>
            <td>${booking.id}</td>
            <td>${booking.guestName}</td>
            <td>${booking.roomNo}</td>
            <td>${booking.checkInDate}</td>
            <td>${booking.status}</td>
            <td>
                <button class="edit-btn"
                onclick="editBooking(${index})">
                Edit
                </button>

                <button class="delete-btn"
                onclick="deleteBooking(${index})">
                Delete
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("bookingCount").innerText =
        bookings.length;

    document.getElementById("checkedIn").innerText =
        checkedIn;

    document.getElementById("checkedOut").innerText =
        checkedOut;
}

function editBooking(index){

    document.getElementById("guestName").value =
        bookings[index].guestName;

    document.getElementById("roomNo").value =
        bookings[index].roomNo;

    document.getElementById("checkInDate").value =
        bookings[index].checkInDate;

    document.getElementById("status").value =
        bookings[index].status;

    editIndex = index;
}

function deleteBooking(index){

    if(confirm("Delete this booking?")){

        bookings.splice(index,1);

        bookings.forEach((booking,i)=>{
            booking.id = i + 1;
        });

        displayBookings();
    }
}

function clearForm(){

    document.getElementById("guestName").value = "";
    document.getElementById("roomNo").value = "";
    document.getElementById("checkInDate").value = "";
    document.getElementById("status").value = "";
}

displayBookings();

</script>

</body>
</html>
