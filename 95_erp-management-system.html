<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
    color:#3498db;
    margin-bottom:10px;
}

.section{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
}

.add-btn{
    background:#28a745;
}

.edit-btn{
    background:#007bff;
}

.delete-btn{
    background:#dc3545;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th,
table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

table th{
    background:#34495e;
    color:white;
}

@media(max-width:768px){
    table{
        display:block;
        overflow-x:auto;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>Enterprise Resource Planning (ERP)</h1>

    <div class="dashboard">
        <div class="card">
            <h2 id="empCount">0</h2>
            <p>Employees</p>
        </div>

        <div class="card">
            <h2>150</h2>
            <p>Products</p>
        </div>

        <div class="card">
            <h2>₹12,50,000</h2>
            <p>Monthly Revenue</p>
        </div>

        <div class="card">
            <h2>8</h2>
            <p>Departments</p>
        </div>
    </div>

    <div class="section">
        <h2>Add Employee</h2>

        <input type="text" id="name" placeholder="Employee Name">

        <input type="text" id="department" placeholder="Department">

        <select id="status">
            <option value="">Select Status</option>
            <option>Active</option>
            <option>On Leave</option>
            <option>Inactive</option>
        </select>

        <button class="add-btn" onclick="saveEmployee()">
            Save Employee
        </button>
    </div>

    <div class="section">
        <h2>Employee Records</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="employeeTable"></tbody>
        </table>
    </div>

</div>

<script>

let employees = [];
let editIndex = -1;

function saveEmployee(){

    let name =
    document.getElementById("name").value;

    let department =
    document.getElementById("department").value;

    let status =
    document.getElementById("status").value;

    if(name === "" || department === "" || status === ""){
        alert("Please fill all fields");
        return;
    }

    if(editIndex === -1){

        employees.push({
            id: employees.length + 1,
            name,
            department,
            status
        });

    }else{

        employees[editIndex].name = name;
        employees[editIndex].department = department;
        employees[editIndex].status = status;

        editIndex = -1;
    }

    clearForm();
    displayEmployees();
}

function displayEmployees(){

    let table =
    document.getElementById("employeeTable");

    table.innerHTML = "";

    employees.forEach((emp,index)=>{

        table.innerHTML += `
        <tr>
            <td>${emp.id}</td>
            <td>${emp.name}</td>
            <td>${emp.department}</td>
            <td>${emp.status}</td>
            <td>
                <button class="edit-btn"
                onclick="editEmployee(${index})">
                Edit
                </button>

                <button class="delete-btn"
                onclick="deleteEmployee(${index})">
                Delete
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("empCount").innerText =
    employees.length;
}

function editEmployee(index){

    document.getElementById("name").value =
    employees[index].name;

    document.getElementById("department").value =
    employees[index].department;

    document.getElementById("status").value =
    employees[index].status;

    editIndex = index;
}

function deleteEmployee(index){

    if(confirm("Delete employee record?")){

        employees.splice(index,1);

        employees.forEach((emp,i)=>{
            emp.id = i + 1;
        });

        displayEmployees();
    }
}

function clearForm(){

    document.getElementById("name").value = "";
    document.getElementById("department").value = "";
    document.getElementById("status").value = "";
}

displayEmployees();

</script>

</body>
</html>
