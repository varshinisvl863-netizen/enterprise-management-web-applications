<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Software</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}

.card h2{
    color:#3498db;
    margin-bottom:10px;
}

.form-section,
.table-section{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.add-btn{
    background:#28a745;
}

.edit-btn{
    background:#007bff;
}

.delete-btn{
    background:#dc3545;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th,
table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

table th{
    background:#34495e;
    color:white;
}

.actions button{
    margin-right:5px;
}

@media(max-width:768px){
    table{
        display:block;
        overflow-x:auto;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>Customer Relationship Management (CRM)</h1>

    <div class="dashboard">
        <div class="card">
            <h2 id="customerCount">0</h2>
            <p>Total Customers</p>
        </div>

        <div class="card">
            <h2 id="leadCount">0</h2>
            <p>Total Leads</p>
        </div>

        <div class="card">
            <h2>₹5,00,000</h2>
            <p>Monthly Revenue</p>
        </div>

        <div class="card">
            <h2>92%</h2>
            <p>Customer Satisfaction</p>
        </div>
    </div>

    <div class="form-section">
        <h2>Add Customer</h2>

        <input type="text" id="name" placeholder="Customer Name">

        <input type="email" id="email" placeholder="Email Address">

        <input type="text" id="phone" placeholder="Phone Number">

        <select id="status">
            <option value="">Select Status</option>
            <option>Lead</option>
            <option>Prospect</option>
            <option>Customer</option>
        </select>

        <button class="add-btn" onclick="addCustomer()">
            Add Customer
        </button>
    </div>

    <div class="table-section">
        <h2>Customer Records</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="customerTable"></tbody>
        </table>
    </div>

</div>

<script>

let customers = [];
let editIndex = -1;

function addCustomer(){

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let status = document.getElementById("status").value;

    if(name==="" || email==="" || phone==="" || status===""){
        alert("Please fill all fields");
        return;
    }

    if(editIndex === -1){

        customers.push({
            id: customers.length + 1,
            name,
            email,
            phone,
            status
        });

    }else{

        customers[editIndex].name = name;
        customers[editIndex].email = email;
        customers[editIndex].phone = phone;
        customers[editIndex].status = status;

        editIndex = -1;
    }

    clearForm();
    displayCustomers();
}

function displayCustomers(){

    let table = document.getElementById("customerTable");
    table.innerHTML = "";

    let leads = 0;

    customers.forEach((customer,index)=>{

        if(customer.status === "Lead"){
            leads++;
        }

        table.innerHTML += `
        <tr>
            <td>${customer.id}</td>
            <td>${customer.name}</td>
            <td>${customer.email}</td>
            <td>${customer.phone}</td>
            <td>${customer.status}</td>
            <td class="actions">
                <button class="edit-btn"
                onclick="editCustomer(${index})">
                Edit
                </button>

                <button class="delete-btn"
                onclick="deleteCustomer(${index})">
                Delete
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("customerCount").innerText =
    customers.length;

    document.getElementById("leadCount").innerText =
    leads;
}

function editCustomer(index){

    document.getElementById("name").value =
    customers[index].name;

    document.getElementById("email").value =
    customers[index].email;

    document.getElementById("phone").value =
    customers[index].phone;

    document.getElementById("status").value =
    customers[index].status;

    editIndex = index;
}

function deleteCustomer(index){

    if(confirm("Delete this customer?")){

        customers.splice(index,1);

        customers.forEach((customer,i)=>{
            customer.id = i + 1;
        });

        displayCustomers();
    }
}

function clearForm(){

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("status").value = "";
}

displayCustomers();

</script>

</body>
</html>
