<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
    color:#3498db;
}

.section{
    background:#fff;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.add-btn{
    background:#28a745;
}

.edit-btn{
    background:#007bff;
}

.delete-btn{
    background:#dc3545;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th,
table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

table th{
    background:#34495e;
    color:white;
}

.low-stock{
    color:red;
    font-weight:bold;
}

@media(max-width:768px){
    table{
        display:block;
        overflow-x:auto;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>Inventory Management System</h1>

    <div class="dashboard">
        <div class="card">
            <h2 id="totalProducts">0</h2>
            <p>Total Products</p>
        </div>

        <div class="card">
            <h2 id="totalStock">0</h2>
            <p>Total Stock</p>
        </div>

        <div class="card">
            <h2 id="lowStockCount">0</h2>
            <p>Low Stock Items</p>
        </div>
    </div>

    <div class="section">
        <h2>Add Product</h2>

        <input type="text" id="productName" placeholder="Product Name">

        <input type="number" id="quantity" placeholder="Quantity">

        <input type="number" id="price" placeholder="Price">

        <button class="add-btn" onclick="saveProduct()">
            Save Product
        </button>
    </div>

    <div class="section">
        <h2>Inventory Records</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price (₹)</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="inventoryTable"></tbody>
        </table>
    </div>

</div>

<script>

let products = [];
let editIndex = -1;

function saveProduct(){

    let productName =
        document.getElementById("productName").value;

    let quantity =
        document.getElementById("quantity").value;

    let price =
        document.getElementById("price").value;

    if(productName === "" || quantity === "" || price === ""){
        alert("Please fill all fields");
        return;
    }

    if(editIndex === -1){

        products.push({
            id: products.length + 1,
            productName,
            quantity: parseInt(quantity),
            price: parseFloat(price)
        });

    }else{

        products[editIndex].productName = productName;
        products[editIndex].quantity = parseInt(quantity);
        products[editIndex].price = parseFloat(price);

        editIndex = -1;
    }

    clearForm();
    displayProducts();
}

function displayProducts(){

    let table =
        document.getElementById("inventoryTable");

    table.innerHTML = "";

    let totalStock = 0;
    let lowStock = 0;

    products.forEach((product,index)=>{

        totalStock += product.quantity;

        let status =
            product.quantity < 10
            ? "<span class='low-stock'>Low Stock</span>"
            : "Available";

        if(product.quantity < 10){
            lowStock++;
        }

        table.innerHTML += `
        <tr>
            <td>${product.id}</td>
            <td>${product.productName}</td>
            <td>${product.quantity}</td>
            <td>₹${product.price}</td>
            <td>${status}</td>
            <td>
                <button class="edit-btn"
                onclick="editProduct(${index})">
                Edit
                </button>

                <button class="delete-btn"
                onclick="deleteProduct(${index})">
                Delete
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("totalProducts").innerText =
        products.length;

    document.getElementById("totalStock").innerText =
        totalStock;

    document.getElementById("lowStockCount").innerText =
        lowStock;
}

function editProduct(index){

    document.getElementById("productName").value =
        products[index].productName;

    document.getElementById("quantity").value =
        products[index].quantity;

    document.getElementById("price").value =
        products[index].price;

    editIndex = index;
}

function deleteProduct(index){

    if(confirm("Delete this product?")){

        products.splice(index,1);

        products.forEach((product,i)=>{
            product.id = i + 1;
        });

        displayProducts();
    }
}

function clearForm(){

    document.getElementById("productName").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("price").value = "";
}

displayProducts();

</script>

</body>
</html>
