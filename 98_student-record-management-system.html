99<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Record Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:20px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
    color:#3498db;
}

.section{
    background:#fff;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input, select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:5px;
    color:#fff;
    cursor:pointer;
}

.add-btn{
    background:#28a745;
}

.edit-btn{
    background:#007bff;
}

.delete-btn{
    background:#dc3545;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th,
table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

table th{
    background:#34495e;
    color:white;
}

@media(max-width:768px){
    table{
        display:block;
        overflow-x:auto;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>Student Record Management System</h1>

    <div class="dashboard">
        <div class="card">
            <h2 id="studentCount">0</h2>
            <p>Total Students</p>
        </div>

        <div class="card">
            <h2 id="avgMarks">0</h2>
            <p>Average Marks</p>
        </div>

        <div class="card">
            <h2 id="topScore">0</h2>
            <p>Highest Marks</p>
        </div>
    </div>

    <div class="section">
        <h2>Add Student Record</h2>

        <input type="text" id="studentName" placeholder="Student Name">

        <input type="text" id="rollNo" placeholder="Roll Number">

        <input type="text" id="department" placeholder="Department">

        <input type="number" id="marks" placeholder="Marks">

        <button class="add-btn" onclick="saveStudent()">
            Save Student
        </button>
    </div>

    <div class="section">
        <h2>Student Records</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Department</th>
                    <th>Marks</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>
        </table>
    </div>

</div>

<script>

let students = [];
let editIndex = -1;

function saveStudent(){

    let studentName =
        document.getElementById("studentName").value;

    let rollNo =
        document.getElementById("rollNo").value;

    let department =
        document.getElementById("department").value;

    let marks =
        document.getElementById("marks").value;

    if(studentName === "" || rollNo === "" ||
       department === "" || marks === ""){
        alert("Please fill all fields");
        return;
    }

    if(editIndex === -1){

        students.push({
            id: students.length + 1,
            studentName,
            rollNo,
            department,
            marks: parseInt(marks)
        });

    }else{

        students[editIndex].studentName = studentName;
        students[editIndex].rollNo = rollNo;
        students[editIndex].department = department;
        students[editIndex].marks = parseInt(marks);

        editIndex = -1;
    }

    clearForm();
    displayStudents();
}

function displayStudents(){

    let table =
        document.getElementById("studentTable");

    table.innerHTML = "";

    let totalMarks = 0;
    let highestMarks = 0;

    students.forEach((student,index)=>{

        totalMarks += student.marks;

        if(student.marks > highestMarks){
            highestMarks = student.marks;
        }

        table.innerHTML += `
        <tr>
            <td>${student.id}</td>
            <td>${student.studentName}</td>
            <td>${student.rollNo}</td>
            <td>${student.department}</td>
            <td>${student.marks}</td>
            <td>
                <button class="edit-btn"
                onclick="editStudent(${index})">
                Edit
                </button>

                <button class="delete-btn"
                onclick="deleteStudent(${index})">
                Delete
                </button>
            </td>
        </tr>`;
    });

    let average =
        students.length > 0
        ? (totalMarks / students.length).toFixed(1)
        : 0;

    document.getElementById("studentCount").innerText =
        students.length;

    document.getElementById("avgMarks").innerText =
        average;

    document.getElementById("topScore").innerText =
        highestMarks;
}

function editStudent(index){

    document.getElementById("studentName").value =
        students[index].studentName;

    document.getElementById("rollNo").value =
        students[index].rollNo;

    document.getElementById("department").value =
        students[index].department;

    document.getElementById("marks").value =
        students[index].marks;

    editIndex = index;
}

function deleteStudent(index){

    if(confirm("Delete this student record?")){

        students.splice(index,1);

        students.forEach((student,i)=>{
            student.id = i + 1;
        });

        displayStudents();
    }
}

function clearForm(){

    document.getElementById("studentName").value = "";
    document.getElementById("rollNo").value = "";
    document.getElementById("department").value = "";
    document.getElementById("marks").value = "";
}

displayStudents();

</script>

</body>
</html>
