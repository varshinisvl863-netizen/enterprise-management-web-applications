<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMS Platform</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#2c3e50;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    width:90%;
    margin:20px auto;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}

.card h2{
    color:#3498db;
    margin-bottom:10px;
}

.section{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:#3498db;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th, table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

table th{
    background:#34495e;
    color:white;
}

.progress-bar{
    width:100%;
    background:#ddd;
    border-radius:20px;
}

.progress{
    height:20px;
    background:#27ae60;
    border-radius:20px;
    text-align:center;
    color:white;
}
</style>
</head>
<body>

<header>
    <h1>Learning Management System (LMS)</h1>
</header>

<div class="container">

    <div class="dashboard">
        <div class="card">
            <h2>120</h2>
            <p>Students</p>
        </div>

        <div class="card">
            <h2>25</h2>
            <p>Courses</p>
        </div>

        <div class="card">
            <h2>15</h2>
            <p>Instructors</p>
        </div>

        <div class="card">
            <h2>87%</h2>
            <p>Completion Rate</p>
        </div>
    </div>

    <div class="section">
        <h2>Add Course</h2>

        <input type="text" id="courseName" placeholder="Course Name">

        <input type="text" id="instructor" placeholder="Instructor Name">

        <button onclick="addCourse()">Add Course</button>
    </div>

    <div class="section">
        <h2>Available Courses</h2>

        <table>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Instructor</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="courseTable">
            </tbody>
        </table>
    </div>

    <div class="section">
        <h2>Student Progress</h2>

        <p>Web Development</p>
        <div class="progress-bar">
            <div class="progress" style="width:75%;">75%</div>
        </div>

        <br>

        <p>Java Programming</p>
        <div class="progress-bar">
            <div class="progress" style="width:60%;">60%</div>
        </div>

        <br>

        <p>Python Development</p>
        <div class="progress-bar">
            <div class="progress" style="width:90%;">90%</div>
        </div>
    </div>

</div>

<script>
function addCourse(){

    let course =
        document.getElementById("courseName").value;

    let instructor =
        document.getElementById("instructor").value;

    if(course === "" || instructor === ""){
        alert("Please fill all fields");
        return;
    }

    let row =
    `<tr>
        <td>${course}</td>
        <td>${instructor}</td>
        <td>Active</td>
    </tr>`;

    document.getElementById("courseTable")
    .innerHTML += row;

    document.getElementById("courseName").value="";
    document.getElementById("instructor").value="";
}
</script>

</body>
</html>
